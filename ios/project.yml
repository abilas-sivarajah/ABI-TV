name: ABITV
options:
  bundleIdPrefix: de.aniworld
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  ABITV:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ABITV
        excludes:
          - "Info.plist"
    # Bewusst kein "info:"-Block: XcodeGen würde die Info.plist damit bei jedem Generieren überschreiben
    # (ATS, Bonjour, Version und Anzeigename gingen verloren). INFOPLIST_FILE reicht.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.aniworld.ios
        PRODUCT_NAME: ABITV
        INFOPLIST_FILE: ABITV/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.14"
        CURRENT_PROJECT_VERSION: "10014"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_PREVIEWS: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO

# Geteiltes Schema, damit "xcodebuild -scheme ABITV" auf dem Build-Server immer eines findet
schemes:
  ABITV:
    build:
      targets:
        ABITV: all
