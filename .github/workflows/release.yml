name: Build & Release ABI TV

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Version aus dem Tag ableiten (v1.2.3 -> versionName 1.2.3, versionCode 10203),
      # damit Tag und App-Version nie auseinanderlaufen
      - name: Determine version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' muss das Format vMAJOR.MINOR.PATCH haben (z. B. v1.0.2)."
            exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "Version $VERSION (versionCode $CODE)"
          echo "VERSION_ARGS=-PappVersionName=$VERSION -PappVersionCode=$CODE" >> "$GITHUB_ENV"

      # Ohne festen Schlüssel würde jeder Build einen neuen Debug-Key bekommen
      # und Android würde jedes In-App-Update ablehnen.
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ABI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ABI_KEYSTORE_BASE64 fehlt. Ohne festen Signierschlüssel schlagen In-App-Updates fehl."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/abi-release.jks"
          echo "ABI_KEYSTORE_PATH=$RUNNER_TEMP/abi-release.jks" >> "$GITHUB_ENV"

      - name: Build Release APKs (TV & Mobile)
        env:
          ABI_KEYSTORE_PASSWORD: ${{ secrets.ABI_KEYSTORE_PASSWORD }}
          ABI_KEY_ALIAS: ${{ secrets.ABI_KEY_ALIAS }}
          ABI_KEY_PASSWORD: ${{ secrets.ABI_KEY_PASSWORD }}
          # Optional: Bilder fürs Titelbild von TMDB (ohne Secret baut die App ohne TMDB)
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew :app:assembleRelease :mobile:assembleRelease $VERSION_ARGS --no-daemon

      - name: Prepare APKs for Release
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/ABI_TV.apk
          cp mobile/build/outputs/apk/release/mobile-release.apk release-artifacts/ABI_Mobile.apk

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs release-artifacts/ABI_TV.apk | grep -E "DN|SHA-256"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ABI-TV-apks
          path: |
            release-artifacts/ABI_TV.apk
            release-artifacts/ABI_Mobile.apk

  desktop:
    name: Build PC Installer (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # jpackage (für den Installer) gibt es erst ab JDK 14; die App läuft mit der mitgelieferten Laufzeit
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' muss das Format vMAJOR.MINOR.PATCH haben (z. B. v1.0.2)."
            exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "VERSION_ARGS=-PappVersionName=$VERSION -PappVersionCode=$CODE" >> "$GITHUB_ENV"

      # Lädt dabei VLC (libvlc + Plugins, Prüfsumme fest im Build) und packt es in den Installer
      - name: Build MSI
        shell: bash
        env:
          # Optional: Bilder fürs Titelbild von TMDB (ohne Secret baut die App ohne TMDB)
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew :desktop:packageMsi $VERSION_ARGS --no-daemon

      - name: Prepare MSI for Release
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp desktop/build/compose/binaries/main/msi/*.msi release-artifacts/ABI_PC.msi
          ls -la release-artifacts

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: ABI-TV-pc
          path: release-artifacts/ABI_PC.msi

  ios:
    name: Build iOS App (IPA)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine version from tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' muss das Format vMAJOR.MINOR.PATCH haben (z. B. v1.0.2)."
              exit 1
            fi
            CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
            echo "IOS_VERSION=$VERSION" >> "$GITHUB_ENV"
            echo "IOS_BUILD_NUMBER=$CODE" >> "$GITHUB_ENV"
          else
            VERSION=$(grep '^appVersionName=' gradle.properties | cut -d'=' -f2)
            CODE=$(grep '^appVersionCode=' gradle.properties | cut -d'=' -f2)
            echo "IOS_VERSION=${VERSION:-1.0.0}" >> "$GITHUB_ENV"
            echo "IOS_BUILD_NUMBER=${CODE:-1}" >> "$GITHUB_ENV"
          fi

      - name: Run Swift Core Unit Tests
        working-directory: ios
        run: swift test

      - name: Generate Xcode Project with XcodeGen
        working-directory: ios
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Build Unsigned iOS App
        working-directory: ios
        run: |
          xcodebuild clean build \
            -project ABITV.xcodeproj \
            -scheme ABITV \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="$IOS_VERSION" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA for Sideloading (AltStore / SideStore / TrollStore)
        run: |
          mkdir -p ios/build/Payload release-artifacts
          cp -R ios/build/Build/Products/Release-iphoneos/ABITV.app ios/build/Payload/ABITV.app
          cd ios/build
          zip -qry ../../release-artifacts/ABI_iOS.ipa Payload
          cd ../..
          ls -lh release-artifacts/ABI_iOS.ipa

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ABI-TV-ios
          path: release-artifacts/ABI_iOS.ipa

  publish:
    name: Publish GitHub Release
    needs: [build, desktop, ios]
    # Ein Fehler beim PC-Installer oder iOS-Build soll das Android-Release nicht aufhalten
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ABI TV ${{ github.ref_name }}
          files: |
            release-artifacts/ABI_TV.apk
            release-artifacts/ABI_Mobile.apk
            release-artifacts/ABI_PC.msi
            release-artifacts/ABI_iOS.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
