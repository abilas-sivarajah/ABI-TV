name: Build & Release ABI TV

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Version aus dem Tag ableiten (v1.2.3 -> versionName 1.2.3, versionCode 10203),
      # damit Tag und App-Version nie auseinanderlaufen
      - name: Determine version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' muss das Format vMAJOR.MINOR.PATCH haben (z. B. v1.0.2)."
            exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "Version $VERSION (versionCode $CODE)"
          echo "VERSION_ARGS=-PappVersionName=$VERSION -PappVersionCode=$CODE" >> "$GITHUB_ENV"

      # Ohne festen Schlüssel würde jeder Build einen neuen Debug-Key bekommen
      # und Android würde jedes In-App-Update ablehnen.
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ABI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ABI_KEYSTORE_BASE64 fehlt. Ohne festen Signierschlüssel schlagen In-App-Updates fehl."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/abi-release.jks"
          echo "ABI_KEYSTORE_PATH=$RUNNER_TEMP/abi-release.jks" >> "$GITHUB_ENV"

      - name: Build Release APKs (TV & Mobile)
        env:
          ABI_KEYSTORE_PASSWORD: ${{ secrets.ABI_KEYSTORE_PASSWORD }}
          ABI_KEY_ALIAS: ${{ secrets.ABI_KEY_ALIAS }}
          ABI_KEY_PASSWORD: ${{ secrets.ABI_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :mobile:assembleRelease $VERSION_ARGS --no-daemon

      - name: Prepare APKs for Release
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/ABI_TV.apk
          cp mobile/build/outputs/apk/release/mobile-release.apk release-artifacts/ABI_Mobile.apk

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs release-artifacts/ABI_TV.apk | grep -E "DN|SHA-256"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ABI TV ${{ github.ref_name }}
          files: |
            release-artifacts/ABI_TV.apk
            release-artifacts/ABI_Mobile.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      # Manuell gestartete Builds (ohne Tag) landen als Test-Artefakt am Workflow-Lauf
      - name: Upload test build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ABI-TV-test-build
          path: |
            release-artifacts/ABI_TV.apk
            release-artifacts/ABI_Mobile.apk
